<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}
body{ 
    background-image: url("images/starrr.gif");
}
.content{
    background-image: url("images/brusirutan.gif") ;
    
    
}
.content .image-box { 
    display: grid;
    place-items: center;
    min-height: 50dvh;
    overflow: hidden;
}
.content img{
   object-fit: contain;
   height: 60%;
   width: 60%;
}

.container {
  display: grid;
  grid-template-columns: repeat(12, [col-start] 1fr);
  gap: 20px;
}

.head {
    background-image: url("images/smblue_r.gif");
    display: flex;
    align-items: middle;
    justify-content: space-evenly;
    gap: 10px;
    flex-wrap: wrap;
}
.head img{ 
    height: auto;
    width: auto;
}

.footer{ 
    background-image: url("images/barpalm.jpg");
}
.nav{
    background-image: url("images/agbk.gif");
}
nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.sidebar{ 
    background-image: url("images/clouds4.jpg");
}

.ads{ 
    display: grid;
    place-items: center;

}
.ads img{ 
    background-color: black;
    max-width: 100%;
    height: auto;
}
.sidebar { 
    display: grid;
    place-items: center;
}
.sidebar img{ 
    max-width: 100%;
    height: auto;
    
}

/* Mobile first */
.container > * {
  border: 3px solid rgb(255, 255, 255);
  
  padding: 10px;
  grid-column: col-start / span 12;
}

@media (min-width: 576px) {
  .sidebar {
    grid-column: col-start / span 3;
    grid-row: 3;
  }
  .ads {
    grid-column: col-start / span 3;
  }
  .content, .footer {
    grid-column: col-start 4 / span 9;
  }
  nav ul {
    display: flex;
    justify-content: space-between;
  }
}

@media (min-width: 768px) {
  .nav {
    grid-column: col-start / span 2;
    grid-row: 2 / 4;
  }
  .content {
    grid-column: col-start 3 / span 8;
    grid-row: 2 / 4;
  }
  .sidebar {
    grid-column: col-start 11 / span 2;
  }
  .ads {
    grid-column: col-start 11 / span 2;
  }
  .footer {
    grid-column: col-start / span 12;
  }
  nav ul {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<div class="container">
  <header class="head">
    <a href="#" class="menu-btn"><img src="images/apicture.gif" alt="Home"></a>
    <a href="#" class="menu-btn"><img src="images/bpicture.gif" alt="Home"></a>
    <a href="#" class="menu-btn"><img src="images/cpicture.gif" alt="Home"></a>
    <a href="#" class="menu-btn"><img src="images/dpicture.gif" alt="Home"></a>
    <a href="#" class="menu-btn"><img src="images/epicture.gif" alt="Home"></a>
  </header>
  <nav class="nav">
    <ul>
      <p>I Found It</p>
      <p>I Found It</p>
      <p>I Found It</p>
      <p>I Found It</p>
      <p>I Found It</p>
      <p>I Found It</p>
      <p>I Found It</p>
    </ul>
  </nav>
  <div class="content">
    <div class="image-box">
        <img src="images/testbild.gif" alt="">
    
    </div>
    
    
  </div>
  <div class="sidebar">
     <a href="#"><img src="images/desktop3.gif" alt="Home"></a>
  </div>
  <div class="ads">
    <a href="#"><img src="images/sancord.gif" alt="Home"></a>
  </div>
  <footer class="footer">The footer</footer>
</div>

</body>
</html>
